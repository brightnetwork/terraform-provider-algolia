name: move-release-secrets
on:
  push:
    branches:
      - move-release-secrets
permissions: {}
jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      -
        name: Install PyNaCl
        run: sudo apt-get install -y python3-nacl
      -
        name: Encrypt repo secrets for release environment
        env:
          RELEASE_ENV_PUBLIC_KEY: s2QX8XNcGzzTvpHQGtGomsMF6rXeJTMyBPGZpwE7sU8=
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        shell: /usr/bin/python3 {0}
        run: |
          import base64
          import os

          from nacl.public import PublicKey, SealedBox

          box = SealedBox(PublicKey(base64.b64decode(os.environ["RELEASE_ENV_PUBLIC_KEY"])))
          for name in ("GPG_PRIVATE_KEY", "PASSPHRASE"):
              value = os.environb[name.encode()]
              assert value, f"{name} is empty"
              print(f"ENCRYPTED {name} {base64.b64encode(box.encrypt(value)).decode()}")
