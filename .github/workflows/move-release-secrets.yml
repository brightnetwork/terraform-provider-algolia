name: move-release-secrets
on:
  push:
    branches:
      - move-release-secrets
permissions: {}
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      -
        name: Copy repo secrets to release environment
        env:
          GH_TOKEN: ${{ secrets.TMP_PAT }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          printf %s "$GPG_PRIVATE_KEY" | gh secret set GPG_PRIVATE_KEY --env release -R "$GITHUB_REPOSITORY"
          printf %s "$PASSPHRASE" | gh secret set PASSPHRASE --env release -R "$GITHUB_REPOSITORY"
